name: Internal Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    name: Create Release Issue
    runs-on: ubuntu-latest
    permissions:
      issues: write 
    
    steps:
      - name: Create Issue with notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          gh issue create \
            --repo ${{ github.repository }} \
            --title "🚀 New Release: ${{ github.event.release.name }}" \
            --body "${{ github.event.release.body }}
            
            🔗 Full details and source code: ${{ github.event.release.html_url }}"